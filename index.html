<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>パラダイス・ロスト</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: serif;
    line-height: 2.2;
}

.story {
    max-width: 680px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 70px 25px 120px;
}

/* =========================
   ページ・シーン
========================= */

.scene {
    display: none;
    min-height: calc(100vh - 190px);
    flex-direction: column;
}

.scene.active {
    display: flex;
}

/* 本文を縦書きにする */
.scene-content {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    height: calc(100vh - 270px);
    min-height: 300px;
    overflow-x: auto;
    overflow-y: hidden;
}

/* =========================
   タイトル画面
========================= */

.title-screen .scene-content {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: visible;
}

.title-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5em;
}

.novel-title {
    margin: 0;
    font-size: 2.2rem;
    font-weight: normal;
    letter-spacing: 0.12em;
}

.author,
.cast {
    margin: 0;
    font-size: 1rem;
}

.cast-name {
    display: inline-block;
    margin-top: 0.4em;
}

/* =========================
   セリフ
========================= */

.voice {
    cursor: pointer;

    text-decoration: underline;
    text-decoration-color: #888;
    text-underline-offset: 6px;

    transition: 0.2s;

    display: inline-block;
    padding: 4px 8px;
    margin: 2px 0;
}

.voice:hover {
    opacity: 0.7;
}

.voice.playing {
    opacity: 0.5;
    text-decoration-color: #fff;
}

/* =========================
   ページ移動
========================= */

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 50px;

    /* ページ移動ボタンは横書きのまま */
    writing-mode: horizontal-tb;
    flex-shrink: 0;
}

.navigation button {
    padding: 10px 20px;

    background: transparent;
    color: #eee;

    border: 1px solid #555;
    border-radius: 4px;

    font-family: serif;
    font-size: 15px;

    cursor: pointer;
}

.navigation button:hover {
    opacity: 0.7;
}

.navigation button:disabled {
    opacity: 0.2;
    cursor: default;
}

.page-number {
    color: #777;
    font-size: 13px;
}

/* =========================
   BGMボタン
========================= */

#bgmButton {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 100;

    padding: 8px 14px;

    background: rgba(17, 17, 17, 0.9);
    color: #aaa;

    border: 1px solid #444;
    border-radius: 4px;

    font-family: serif;
    font-size: 13px;

    cursor: pointer;
}

#bgmButton:hover {
    color: #fff;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .story {
        padding:
            70px
            22px
            100px;
    }

    .scene {
        min-height: calc(100vh - 170px);
    }

    .scene-content {
        height: calc(100vh - 240px);
        min-height: 250px;
    }

    .title-screen .scene-content {
        overflow: visible;
    }

    .novel-title {
        font-size: 1.8rem;
    }

    .navigation {
        margin-top: 35px;
    }

    .navigation button {
        padding: 9px 16px;
    }

    #bgmButton {
        top: 12px;
        right: 12px;
        font-size: 12px;
    }
}

</style>

</head>


<body>

<button id="bgmButton" type="button">
    BGMを再生
</button>


<div class="story">

    <!-- =========================
         タイトル画面
    ========================= -->

    <section class="scene title-screen active">

        <div class="scene-content title-content">

            <h1 class="novel-title">
                パラダイス・ロスト
            </h1>

            <p class="author">
                原作者　雨津庵
            </p>

            <p class="cast">
                キャスト<br>
                <span class="cast-name">佐渡快</span><br>
                <span class="cast-name">中村宏平</span>
            </p>

        </div>


        <div class="navigation">

            <button
                class="prev-button"
                type="button"
                disabled
            >
                ← 戻る
            </button>

            <span class="page-number">
                1 / 3
            </span>

            <button class="next-button" type="button">
                次へ →
            </button>

        </div>

    </section>


    <!-- =========================
         Scene 1
    ========================= -->

    <section
        class="scene"
        data-bgm="bgm/scene01.mp3"
    >

        <div class="scene-content">

            <p>
                雨が静かに降っていた。
            </p>

            <p>
                男は私を見つめた。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/doushita.mp3"
                >
                    「どうしたの？」
                </span>
            </p>

            <p>
                私は何も答えなかった。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/kochi.mp3"
                >
                    「こっちへおいで」
                </span>
            </p>

        </div>


        <div class="navigation">

            <button class="prev-button" type="button">
                ← 戻る
            </button>

            <span class="page-number">
                2 / 3
            </span>

            <button class="next-button" type="button">
                次へ →
            </button>

        </div>

    </section>


    <!-- =========================
         Scene 2
    ========================= -->

    <section
        class="scene"
        data-bgm="bgm/scene02.mp3"
    >

        <div class="scene-content">

            <p>
                私はゆっくりと部屋へ入った。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/oborelo.mp3"
                >
                    「僕に溺れろ」
                </span>
            </p>

            <p>
                私は高揚感に包まれる。
            </p>

        </div>


        <div class="navigation">

            <button class="prev-button" type="button">
                ← 戻る
            </button>

            <span class="page-number">
                3 / 3
            </span>

            <button
                class="next-button"
                type="button"
                disabled
            >
                次へ →
            </button>

        </div>

    </section>

</div>


<audio id="voiceAudio"></audio>

<audio
    id="bgmAudio"
    src="bgm/scene01.mp3"
    loop
></audio>


<script>

/* ==================================================
   セリフ音声
================================================== */

const audio = document.getElementById("voiceAudio");
const voices = document.querySelectorAll(".voice");

voices.forEach(function(voice) {
    voice.addEventListener("click", async function() {
        voices.forEach(function(v) {
            v.classList.remove("playing");
        });

        voice.classList.add("playing");
        audio.src = voice.dataset.audio;
        audio.currentTime = 0;

        try {
            await audio.play();
        } catch (error) {
            console.error("セリフ音声を再生できませんでした:", error);
            voice.classList.remove("playing");
        }
    });
});

audio.addEventListener("ended", function() {
    voices.forEach(function(voice) {
        voice.classList.remove("playing");
    });
});


/* ==================================================
   BGM
================================================== */

const bgm = document.getElementById("bgmAudio");
const bgmButton = document.getElementById("bgmButton");

const BGM_VOLUME = 0.08;

/*
   ユーザーがBGMボタンで再生を選んだかどうか。
   trueなら、シーンを切り替えたときも新しいBGMを再生する。
*/
let bgmEnabled = false;

bgm.volume = BGM_VOLUME;


function updateBgmButton() {
    bgmButton.textContent = bgmEnabled
        ? "BGMを停止"
        : "BGMを再生";
}


/* BGM再生・停止ボタン */
bgmButton.addEventListener("click", async function() {
    if (bgmEnabled) {
        bgmEnabled = false;
        bgm.pause();
        bgm.volume = BGM_VOLUME;
        updateBgmButton();
        return;
    }

    bgmEnabled = true;
    bgm.volume = BGM_VOLUME;
    updateBgmButton();

    try {
        await bgm.play();
    } catch (error) {
        bgmEnabled = false;
        updateBgmButton();
        console.error("BGMを再生できませんでした:", error);
    }
});


/* ==================================================
   BGMシーン切り替え
================================================== */

function changeBgm(newBgm) {
    const newBgmUrl = new URL(newBgm, document.baseURI).href;

    if (bgm.src === newBgmUrl) {
        return;
    }

    const shouldPlay = bgmEnabled;

    /*
       曲を切り替える。
       BGMがオンなら、src変更後すぐにplay()を呼び出す。
    */
    bgm.pause();
    bgm.src = newBgmUrl;
    bgm.currentTime = 0;
    bgm.volume = BGM_VOLUME;

    if (shouldPlay) {
        const playPromise = bgm.play();

        if (playPromise !== undefined) {
            playPromise.catch(function(error) {
                bgmEnabled = false;
                updateBgmButton();
                console.error(
                    "次のシーンのBGMを再生できませんでした:",
                    error
                );
            });
        }
    }

    updateBgmButton();
}


/* ==================================================
   ページ・シーン
================================================== */

const scenes = document.querySelectorAll(".scene");
let currentScene = 0;


/* ==================================================
   ページ変更
================================================== */

function showScene(index) {
    if (index < 0 || index >= scenes.length) {
        return;
    }

    /* 前のシーンのセリフを停止 */
    audio.pause();
    audio.currentTime = 0;

    voices.forEach(function(voice) {
        voice.classList.remove("playing");
    });

    /* ページ表示を切り替える */
    scenes.forEach(function(scene) {
        scene.classList.remove("active");
    });

    scenes[index].classList.add("active");
    currentScene = index;

    /*
       data-bgmが設定されているページだけBGMを切り替える。
       タイトル画面にはdata-bgmがない。
    */
    const newBgm = scenes[index].dataset.bgm;

    if (newBgm) {
        changeBgm(newBgm);
    }

    /* ページ上部へ移動 */
    window.scrollTo({
        top: 0,
        behavior: "instant"
    });
}


/* ==================================================
   次へ
================================================== */

const nextButtons = document.querySelectorAll(".next-button");

nextButtons.forEach(function(button) {
    button.addEventListener("click", function() {
        showScene(currentScene + 1);
    });
});


/* ==================================================
   戻る
================================================== */

const prevButtons = document.querySelectorAll(".prev-button");

prevButtons.forEach(function(button) {
    button.addEventListener("click", function() {
        showScene(currentScene - 1);
    });
});


/* 初期状態のボタン表示 */
updateBgmButton();

</script>

</body>

</html>
