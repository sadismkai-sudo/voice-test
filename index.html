<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Novel Test</title>

<style>

body {
margin: 0;
background: #111;
color: #eee;
font-family: serif;
line-height: 2.2;
}

.story {
max-width: 680px;
margin: 0 auto;
padding: 50px 25px;
}

.voice {
cursor: pointer;
text-decoration: underline;
text-decoration-color: #888;
text-underline-offset: 6px;
transition: 0.2s;
}

.voice:hover {
opacity: 0.7;
}

.voice.playing {
opacity: 0.5;
}

</style>

</head>


<body>

<div class="story">

<p>
雨が静かに降っていた。
</p>

<p>
男は私を見つめた。
</p>

<p>
<span class="voice" data-audio="doushita.mp3">
「どうしたの？」
</span>
</p>

<p>
私は何も答えなかった。
</p>

<p>
彼はゆっくりとこちらへ近づいた。
</p>

<p>
<span class="voice" data-audio="kochi.mp3">
「こっちへおいで」
</span>
</p>

<p>
私は動けなかった。
</p>

<p>
彼は小さく笑った。
</p>

<p>
<span class="voice" data-audio="oborelo.mp3">
「僕に溺れろ」
</span>
</p>

<p>
私は高揚感に包まれる。
</p>

</div>


<audio id="voiceAudio"></audio>


<script>

const audio = document.getElementById("voiceAudio");

const voices = document.querySelectorAll(".voice");


voices.forEach(function(voice) {

voice.addEventListener("click", function() {

voices.forEach(function(v) {
v.classList.remove("playing");
});

voice.classList.add("playing");

audio.src = voice.dataset.audio;

audio.currentTime = 0;

audio.play();

});

});


audio.addEventListener("ended", function() {

voices.forEach(function(v) {
v.classList.remove("playing");
});

});

</script>

</body>

</html>
