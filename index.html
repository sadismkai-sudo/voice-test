<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Novel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: serif;
    line-height: 2.2;
}

.story {
    max-width: 680px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 70px 25px 120px;
}

/* =========================
   シーン
========================= */

.scene {
    display: none;
    min-height: calc(100vh - 190px);
    flex-direction: column;
}

.scene.active {
    display: flex;
}

/* =========================
   セリフ
========================= */

.voice {
    cursor: pointer;

    text-decoration: underline;
    text-decoration-color: #888;
    text-underline-offset: 6px;

    transition: 0.2s;

    display: inline-block;
    padding: 4px 8px;
    margin: 2px 0;
}

.voice:hover {
    opacity: 0.7;
}

.voice.playing {
    opacity: 0.5;
    text-decoration-color: #fff;
}

/* =========================
   ページ移動
========================= */

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 50px;
}

.navigation button {
    padding: 10px 20px;

    background: transparent;
    color: #eee;

    border: 1px solid #555;
    border-radius: 4px;

    font-family: serif;
    font-size: 15px;

    cursor: pointer;
}

.navigation button:hover {
    opacity: 0.7;
}

.navigation button:disabled {
    opacity: 0.2;
    cursor: default;
}

.page-number {
    color: #777;
    font-size: 13px;
}

/* =========================
   BGMボタン
========================= */

#bgmButton {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 100;

    padding: 8px 14px;

    background: rgba(17, 17, 17, 0.9);
    color: #aaa;

    border: 1px solid #444;
    border-radius: 4px;

    font-family: serif;
    font-size: 13px;

    cursor: pointer;
}

#bgmButton:hover {
    color: #fff;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .story {
        padding:
            70px
            22px
            100px;
    }

    .scene {
        min-height: calc(100vh - 170px);
    }

    .navigation {
        margin-top: 35px;
    }

    .navigation button {
        padding: 9px 16px;
    }

    #bgmButton {
        top: 12px;
        right: 12px;
        font-size: 12px;
    }
}

</style>

</head>


<body>

<button id="bgmButton">
    BGMを再生
</button>


<div class="story">

    <!-- =========================
         Scene 1
    ========================= -->

    <section
        class="scene active"
        data-bgm="bgm/scene01.mp3"
    >

        <div class="scene-content">

            <p>
                雨が静かに降っていた。
            </p>

            <p>
                男は私を見つめた。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/doushita.mp3"
                >
                    「どうしたの？」
                </span>
            </p>

            <p>
                私は何も答えなかった。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/kochi.mp3"
                >
                    「こっちへおいで」
                </span>
            </p>

        </div>


        <div class="navigation">

            <button
                class="prev-button"
                disabled
            >
                ← 戻る
            </button>

            <span class="page-number">
                1 / 2
            </span>

            <button class="next-button">
                次へ →
            </button>

        </div>

    </section>


    <!-- =========================
         Scene 2
    ========================= -->

    <section
        class="scene"
        data-bgm="bgm/scene02.mp3"
    >

        <div class="scene-content">

            <p>
                私はゆっくりと部屋へ入った。
            </p>

            <p>
                <span
                    class="voice"
                    data-audio="audio/oborelo.mp3"
                >
                    「僕に溺れろ」
                </span>
            </p>

            <p>
                私は高揚感に包まれる。
            </p>

        </div>


        <div class="navigation">

            <button class="prev-button">
                ← 戻る
            </button>

            <span class="page-number">
                2 / 2
            </span>

            <button
                class="next-button"
                disabled
            >
                次へ →
            </button>

        </div>

    </section>

</div>


<audio id="voiceAudio"></audio>

<audio
    id="bgmAudio"
    src="bgm/scene01.mp3"
    loop
></audio>


<script>

/* ==================================================
   セリフ音声
================================================== */

const audio = document.getElementById("voiceAudio");

const voices = document.querySelectorAll(".voice");


voices.forEach(function(voice) {

    voice.addEventListener("click", function() {

        voices.forEach(function(v) {
            v.classList.remove("playing");
        });

        voice.classList.add("playing");

        audio.src = voice.dataset.audio;

        audio.currentTime = 0;

        audio.play();

    });

});


audio.addEventListener("ended", function() {

    voices.forEach(function(v) {
        v.classList.remove("playing");
    });

});


/* ==================================================
   BGM
================================================== */

const bgm = document.getElementById("bgmAudio");

const bgmButton = document.getElementById("bgmButton");


/*
    BGM音量

    以前：0.20
    前回：0.08
    今回：0.08

    今回はHTMLのvolumeではなく、
    Web Audio APIのGainNodeで音量を制御する。
*/

const BGM_VOLUME = 0.08;


/* ==================================================
   Web Audio API
================================================== */

let audioContext = null;

let bgmSource = null;

let bgmGain = null;


function setupBgmAudio() {

    if (audioContext) {
        return;
    }


    audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    bgmSource =
        audioContext.createMediaElementSource(bgm);


    bgmGain =
        audioContext.createGain();


    bgmSource.connect(bgmGain);

    bgmGain.connect(audioContext.destination);


    bgmGain.gain.value = BGM_VOLUME;

}


/* ==================================================
   BGM再生
================================================== */

async function playBgm() {

    setupBgmAudio();


    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }


    bgmGain.gain.setValueAtTime(
        BGM_VOLUME,
        audioContext.currentTime
    );


    await bgm.play();


    bgmButton.textContent = "BGMを停止";

}


/* ==================================================
   BGM停止
================================================== */

function stopBgm() {

    bgm.pause();

    bgmButton.textContent = "BGMを再生";

}


/* ==================================================
   BGMボタン
================================================== */

bgmButton.addEventListener("click", async function() {

    setupBgmAudio();


    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }


    if (bgm.paused) {

        await playBgm();

    } else {

        stopBgm();

    }

});


/* ==================================================
   BGMシーン切り替え
================================================== */

let changingBgm = false;


async function changeBgm(newBgm) {

    if (bgm.src.endsWith(newBgm)) {
        return;
    }


    setupBgmAudio();


    /*
       BGM停止中なら、
       曲だけ変更して再生しない。
    */

    if (bgm.paused) {

        bgm.src = newBgm;

        bgm.currentTime = 0;

        return;
    }


    if (changingBgm) {
        return;
    }


    changingBgm = true;


    const now = audioContext.currentTime;


    /*
       約0.15秒でフェードアウト
    */

    bgmGain.gain.cancelScheduledValues(now);

    bgmGain.gain.setValueAtTime(
        bgmGain.gain.value,
        now
    );

    bgmGain.gain.linearRampToValueAtTime(
        0,
        now + 0.15
    );


    /*
       フェードアウト完了後に曲変更
    */

    setTimeout(async function() {

        bgm.src = newBgm;

        bgm.currentTime = 0;


        try {

            await bgm.play();

        } catch (error) {

            changingBgm = false;

            return;

        }


        const newNow = audioContext.currentTime;


        /*
           約0.15秒でフェードイン
        */

        bgmGain.gain.cancelScheduledValues(newNow);

        bgmGain.gain.setValueAtTime(
            0,
            newNow
        );

        bgmGain.gain.linearRampToValueAtTime(
            BGM_VOLUME,
            newNow + 0.15
        );


        changingBgm = false;

    }, 160);

}


/* ==================================================
   シーン
================================================== */

const scenes =
    document.querySelectorAll(".scene");

let currentScene = 0;


/* ==================================================
   シーン変更
================================================== */

async function showScene(index) {

    if (
        index < 0 ||
        index >= scenes.length
    ) {
        return;
    }


    /*
       ★ 前のシーンのセリフを即停止
    */

    audio.pause();

    audio.currentTime = 0;


    voices.forEach(function(v) {
        v.classList.remove("playing");
    });


    /*
       シーン表示変更
    */

    scenes.forEach(function(scene) {
        scene.classList.remove("active");
    });


    scenes[index].classList.add("active");


    currentScene = index;


    /*
       BGM変更
    */

    const newBgm =
        scenes[index].dataset.bgm;


    await changeBgm(newBgm);


    /*
       ページ上部へ
    */

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

}


/* ==================================================
   次へ
================================================== */

const nextButtons =
    document.querySelectorAll(".next-button");


nextButtons.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            showScene(
                currentScene + 1
            );

        }
    );

});


/* ==================================================
   戻る
================================================== */

const prevButtons =
    document.querySelectorAll(".prev-button");


prevButtons.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            showScene(
                currentScene - 1
            );

        }
    );

});


</script>

</body>

</html>
